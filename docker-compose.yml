version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: dayflow_db
    environment:
      - POSTGRES_USER=dayflow_user
      - POSTGRES_PASSWORD=dayflow_pass
      - POSTGRES_DB=dayflow_db
    ports:
      - "5433:5432"
    volumes:
      - dayflow_db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayflow_user -d dayflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: dayflow_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@dayflow.dev
      - PGADMIN_DEFAULT_PASSWORD=admin123
    ports:
      - "5050:80"
    volumes:
      - dayflow_pgadmin_data:/var/lib/pgadmin
    restart: always
    depends_on:
      - db

volumes:
  dayflow_db_data:
  dayflow_pgadmin_data:
